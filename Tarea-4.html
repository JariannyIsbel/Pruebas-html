<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>
<body>
    
     <form>
            <label for="name">Nombre:</label>
            <input type="text" id="name" name="name" placeholder="Escribe tu nombre" required>

            <label for="surname">Apellidos:</label>
            <input type="text" id="surname" name="surname" placeholder="Escribe tu apellido" required>

            <label for="email">Correo:</label>
            <input type="email" id="email" name="email" placeholder="ejem@gmail.com" required>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" minlength="8" placeholder="mínimo 8 carácteres" required>

            <label for="date">Fecha de nacimiento</label>
            <input type="date" id="date" name="birthdate"><br>

            <fieldset>
                <legend>Elige tu género</legend>
              <input type="radio" id="male" name="gender" value="male">
            <label for="male">Masculino</label>
     
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Femenino</label><br>
             </fieldset>

            <fieldset>
               <legend>Elige tus hobbies favoritos</legend>
            <input type="checkbox" id="sport" name="interests" value="sport">
            <label for="sport">Deporte</label>

            <input type="checkbox" id="music" name="interests" value="music">
            <label for="music">Música</label>
        
            <input type="checkbox" id="reading" name="interests" value="reading">
            <label for="reading">Lectura</label><br>

            </fieldset>
          
            <textarea name="comentarios" rows="5" cols="30" placeholder="dejanos un comentario"></textarea><br>

             <label for="countries">Elige tu país:</label>
            <select id="countries" name="countries">
                <option value="venezuela">Venezuela</option>
                <option value="chile">Chile</option>
                <option value="japón">Japón</option>
            </select><br>
            <button type="submit">Enviar</button>
     </form>


</body>
</html>
